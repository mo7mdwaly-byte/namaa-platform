<style>
:root{--bg:#fbf8f1;--c:#fff;--t:#183335;--m:#657475;--g:#073f42;--g2:#0b6260;--a:#c99b42;--l:#e8e3d8;--sh:0 14px 36px #073f4218;--fd:"Playfair Display",Georgia,serif;--fb:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1f20;--c:#112b2c;--t:#eef0e8;--m:#9db0ac;--g:#052c2e;--l:#25403f;--sh:0 14px 36px #0006}}
:root[dir=rtl]{--fd:Cairo,Tahoma,sans-serif;--fb:Cairo,Tahoma,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 var(--fb)}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.01em}
#ann{background:var(--g);color:#fff;text-align:center;font-size:12px;padding:7px;letter-spacing:.04em}#ann span{color:#e9c879}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:#ffffffeb;color:var(--g);backdrop-filter:blur(12px);display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--l)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) header{background:#0a1f20e8;color:#fff}}
header img{width:40px;height:40px;border-radius:50%;object-fit:contain;background:#fff}.bt{flex:1;font-weight:800;letter-spacing:.16em;font-size:20px;line-height:1}.bt small{display:block;font-size:8px;letter-spacing:.2em;color:var(--a);margin-top:3px}
button{font:inherit;cursor:pointer;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:999px;padding:8px 14px;transition:.2s}button:hover{transform:translateY(-1px)}
.p{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}.p:hover{background:var(--g2)}.gold{background:var(--a);color:#143b3b;border-color:var(--a);font-weight:700}.ghost{background:transparent;color:#fff;border-color:#ffffff66}
header button{padding:7px 12px}
#nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;max-width:1000px;margin:auto}#nav button em{font-style:normal;margin-inline-end:5px}#nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{padding:0 16px 100px;max-width:1000px;margin:auto}main>*{animation:up .5s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;align-items:center;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:26px;padding:34px 30px;margin:6px 0 18px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero:before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(#c99b4255,transparent 65%);top:-90px;inset-inline-end:-60px}
.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.12;margin:10px 0}.hero h1 em{color:#e9c879}.hero p{color:#dbe9e6;max-width:46ch}.eb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#e9c879;font-weight:700}
.hb{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.proof{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#cfe3df}
.ha{position:relative;display:grid;place-items:center;min-height:240px}.hl{width:min(260px,80%);border-radius:50%;background:#fff;padding:6px;box-shadow:0 20px 50px #0006;animation:fl 6s ease-in-out infinite;position:relative}@keyframes fl{50%{transform:translateY(-10px)}}
.fl{position:absolute;background:#ffffffee;color:var(--g);border-radius:14px;padding:9px 12px;font-size:12px;box-shadow:var(--sh);backdrop-filter:blur(6px)}.fl b{display:block}.f1{top:6px;inset-inline-start:0}.f2{bottom:6px;inset-inline-end:0}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding:26px 20px}.ha{min-height:200px}.hl{width:170px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;transition:.25s;box-shadow:0 2px 8px #0000000a}.card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.card h3{margin:0;font-size:15px;line-height:1.3}.card small{color:var(--m)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cov{aspect-ratio:3/4;border-radius:4px 12px 12px 4px;padding:14px 12px 12px 18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:6px 10px 20px #0003;text-align:start}
.cov:before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(90deg,#0004,#fff2)}.cov:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;border:1px solid #c99b4299;inset-inline-end:-26px;top:-26px;box-shadow:0 0 0 14px #c99b4222}
.card .cov i{font-style:normal;font-size:9px;letter-spacing:.2em;color:#e9c879;font-weight:700}.cov b{font-family:var(--fd);font-size:15px;line-height:1.2;position:relative}.cov u{width:26px;height:2px;background:#e9c879;display:block}.cov small{color:#ffffffcc!important;font-size:10px}
.tag{font-size:10px;background:var(--a);color:#143b3b;border-radius:99px;padding:2px 9px;font-weight:700;width:fit-content}
input,select,textarea{font:inherit;width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--l);background:var(--c);color:var(--t);margin:4px 0}
.box{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0000000a}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button.on{background:var(--a);color:#143b3b;font-weight:700;border-color:var(--a)}
.plan.best{border:2px solid var(--a);transform:scale(1.02)}.stat{text-align:center}.stat b{font-size:22px;display:block;font-family:var(--fd);color:var(--a)}
.steps{display:flex;gap:6px;margin-bottom:8px}.steps span{flex:1;height:5px;border-radius:9px;background:var(--l)}.steps span.on{background:var(--a)}
.bar{height:6px;background:var(--l);border-radius:9px;overflow:hidden}.bar div{height:100%;background:var(--a)}
.sec{margin:34px 0 14px}.sec i{font-style:normal;font-size:11px;letter-spacing:.14em;color:var(--a);font-weight:700;text-transform:uppercase}.sec h2{margin:2px 0 4px;font-size:clamp(22px,4.5vw,30px)}.sec p{color:var(--m);margin:0}
.feat{text-align:center;padding:18px 10px}.feat em{font-style:normal;font-size:28px}.feat h3{margin:6px 0 2px}
.crs{display:grid;grid-template-columns:1fr 1.1fr;border-radius:24px;overflow:hidden;background:var(--c);border:1px solid var(--l);box-shadow:var(--sh)}.crs .art{background:linear-gradient(135deg,var(--g),var(--g2));display:grid;place-items:center;min-height:200px;position:relative}.crs .art div{width:90px;height:90px;border-radius:50%;border:2px solid #e9c879;display:grid;place-items:center;color:#e9c879;font:700 34px var(--fd)}.crs .art button{position:absolute;bottom:14px;inset-inline-start:14px;background:#e9c879;color:#143b3b;border:0;width:46px;height:46px;padding:0}.crs .tx{padding:22px}.crs .tx h3{font-size:22px;margin:6px 0}
@media(max-width:700px){.crs{grid-template-columns:1fr}}
.fnd{display:grid;grid-template-columns:.8fr 1.2fr;gap:20px;align-items:center}.pt{aspect-ratio:1;border-radius:26px;background:linear-gradient(145deg,#e9c879,#c99b42);display:grid;place-items:center;color:#143b3b;text-align:center;font-size:10px;font-weight:800;letter-spacing:.14em;padding:10px}.pt b{display:block;font:700 54px var(--fd);letter-spacing:0}
.qt{border-inline-start:3px solid var(--a);padding-inline-start:14px;font:600 18px/1.5 var(--fd);color:var(--g);margin:14px 0}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .qt{color:#e9c879}}
@media(max-width:700px){.fnd{grid-template-columns:1fr}.pt{max-width:200px;margin:auto}}
.join{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:24px;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:34px 0 0}.join h2{margin:4px 0}.join p{margin:0;color:#dbe9e6}
.foot{margin-top:34px;border-top:1px solid var(--l);padding-top:22px;color:var(--m);font-size:13px}.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px}.fg a{display:block;color:var(--m);padding:2px 0;cursor:pointer}.fg h4{margin:0 0 6px;color:var(--t)}.cp{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--l);font-size:12px}
@media(max-width:700px){.fg{grid-template-columns:1fr 1fr}.fg>div:first-child{grid-column:1/-1}
#nav{position:fixed;bottom:0;inset-inline:0;z-index:8;background:var(--c);border-top:1px solid var(--l);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));max-width:none;overflow:visible}#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:10px;padding:4px 6px;border-radius:12px}#nav button em{margin:0;font-size:19px}#nav button.on{background:#c99b4233;color:var(--t)}}
#cart{position:fixed;inset:auto 0 0 0;background:var(--c);border-top:2px solid var(--a);border-radius:22px 22px 0 0;padding:18px;max-height:70vh;overflow:auto;display:none;z-index:9;box-shadow:0 -10px 40px #0004}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:20}
small,.m{color:var(--m)}hr{border:0;border-top:1px solid var(--l)}
.cov.im{padding:0;background:#000}.cov.im:before,.cov.im:after{display:none}.cov.im img{width:100%;height:100%;object-fit:cover;display:block}
.pt{overflow:hidden;padding:0}.pt img{width:100%;height:100%;object-fit:cover}
.buy{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--c);border-top:2px solid var(--a);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 -8px 30px #0003}
@media(max-width:700px){.buy{bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:10px}}
.bkh{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}.bkh .cov{box-shadow:8px 14px 28px #0004}@media(max-width:480px){.bkh{grid-template-columns:110px 1fr}}
.stars button{border:0;background:none;font-size:26px;padding:0 2px;color:var(--a)}.drh{position:relative;margin-bottom:18px}.drh>img{width:100%;border-radius:24px;max-height:300px;object-fit:cover}.drh .av{position:absolute;bottom:-50px;inset-inline-start:24px;width:110px;height:110px;border-radius:50%;border:4px solid var(--bg);object-fit:cover;box-shadow:var(--sh)}
textarea{min-height:80px}.sg{position:relative;margin:18px 0;border-radius:24px;overflow:hidden;box-shadow:var(--sh)}.sg img{width:100%;max-height:520px;object-fit:cover;object-position:center 40%;display:block}.sg span{position:absolute;bottom:0;inset-inline:0;padding:30px 16px 12px;background:linear-gradient(transparent,#073f42dd);color:#fff;font:600 15px var(--fd)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--a);outline-offset:2px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}</style></head><body>
